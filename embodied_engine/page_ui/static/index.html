<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Page</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --ink:#e6e8eb; --dim:#8b93a1; --accent:#4f8cff; --good:#3ec47e; --bad:#e0563a; --warn:#e0b53a; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,Segoe UI,Roboto,"Microsoft YaHei",sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; max-width:1100px; margin:0 auto; padding:10px; gap:8px; }
  header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.5px; }
  .ctrl { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  label { color:var(--dim); font-size:12px; }
  select, input[type=text], button {
    background:var(--panel); color:var(--ink); border:1px solid #2a2f3a; border-radius:6px;
    padding:6px 9px; font-size:13px; outline:none;
  }
  select:focus, input[type=text]:focus { border-color:var(--accent); }
  input[type=text] { flex:1; min-width:180px; }
  button { cursor:pointer; user-select:none; transition:background .12s, opacity .12s; }
  button:hover:not(:disabled) { background:#222632; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { border-color:var(--accent); color:#cfe0ff; }
  #views { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:8px; min-height:0; }
  .view { position:relative; background:#000; border:1px solid #2a2f3a; border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .view canvas { width:100%; height:100%; object-fit:contain; image-rendering:auto; }
  .view .tag { position:absolute; left:8px; top:6px; background:rgba(0,0,0,.45); color:var(--ink); font-size:11px; padding:2px 7px; border-radius:4px; }
  .view .placeholder { color:var(--dim); font-size:12px; }
  #status { font-size:13px; min-height:20px; color:var(--dim); }
  #status .phase { color:var(--ink); }
  #status .good { color:var(--good); } #status .bad { color:var(--bad); } #status .warn { color:var(--warn); }
  #identity { display:flex; flex-wrap:wrap; gap:4px 16px; background:var(--panel); border:1px solid #2a2f3a; border-radius:8px; padding:6px 9px; font-size:11px; color:var(--dim); }
  #identity b { color:var(--ink); font-weight:500; }
  #identity .bad { color:var(--bad); }
  .hint { color:var(--dim); font-size:11px; }
  @media (max-width:680px){ #views{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Page</h1>
    <div class="ctrl">
      <label for="scene">场景</label>
      <select id="scene"></select>
      <button id="load" class="primary">加载场景</button>
    </div>
    <div class="ctrl" style="flex:1;">
      <label for="task">任务</label>
      <input id="task" type="text" placeholder="输入任务指令" disabled />
      <button id="start" class="primary" disabled>开始</button>
      <button id="restart" disabled>重新开始</button>
      <button id="stop" disabled>停止</button>
      <button id="reset" disabled>重置</button>
    </div>
  </header>
  <div id="identity">
    <span>Agent: <b id="id-agent">—</b></span>
    <span>Action: <b id="id-action">—</b></span>
    <span>World: <b id="id-world">—</b></span>
    <span>Inference: <b id="id-inference">—</b></span>
    <span>Phase: <b id="id-phase">—</b></span>
    <span id="id-failure-wrap" style="display:none;">Failure: <b id="id-failure" class="bad"></b></span>
  </div>
  <div id="views">
    <div class="view"><span class="tag">Agent</span><canvas id="agent"></canvas><span class="placeholder" id="ph-agent">未加载场景</span></div>
    <div class="view"><span class="tag">Wrist</span><canvas id="wrist"></canvas><span class="placeholder" id="ph-wrist">未加载场景</span></div>
  </div>
  <div id="status"><span class="phase">就绪</span></div>
</div>
<script src="static/app.js"></script>
</body>
</html>
