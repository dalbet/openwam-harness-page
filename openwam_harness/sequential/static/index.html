<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Page</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --ink:#e6e8eb; --dim:#8b93a1; --accent:#4f8cff; --good:#3ec47e; --bad:#e0563a; --warn:#e0b53a; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,Segoe UI,Roboto,"Microsoft YaHei",sans-serif; }
  #app { display:flex; flex-direction:column; min-height:100vh; max-width:1100px; margin:0 auto; padding:10px; gap:8px; }
  header, .ctrl { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  #health { color:var(--dim); font-size:12px; }
  label { color:var(--dim); font-size:12px; }
  select, input[type=text], button {
    background:var(--panel); color:var(--ink); border:1px solid #2a2f3a; border-radius:6px;
    padding:6px 9px; font-size:13px; outline:none;
  }
  button { cursor:pointer; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { border-color:var(--accent); color:#cfe0ff; }
  #task { flex:1; min-width:180px; }
  #views { display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:start; }
  .view {
    position:relative; background:#000; border:1px solid #2a2f3a; border-radius:8px; overflow:hidden;
    width:100%; aspect-ratio:var(--ar, 1);
  }
  .view canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  .view .tag { position:absolute; left:8px; top:6px; background:rgba(0,0,0,.45); font-size:11px; padding:2px 7px; border-radius:4px; }
  .view .placeholder { color:var(--dim); font-size:12px; position:absolute; }
  #status { font-size:13px; min-height:20px; color:var(--dim); }
  #status .phase { color:var(--ink); }
  #status .good { color:var(--good); } #status .bad { color:var(--bad); } #status .warn { color:var(--warn); }
  details { background:var(--panel); border:1px solid #2a2f3a; border-radius:8px; padding:8px 10px; }
  details pre { white-space:pre-wrap; word-break:break-word; max-height:240px; overflow:auto; font-size:12px; }
  .hint { color:var(--dim); font-size:12px; }
  @media (max-width:680px){ #views{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Page · sequential</h1>
    <span id="health">正在检查服务…</span>
    <button id="retry" type="button" hidden>重试检查</button>
  </header>
  <div class="ctrl">
    <label for="suite">套件</label>
    <select id="suite" disabled></select>
    <button id="load" class="primary" type="button" disabled>加载场景</button>
    <label for="task">任务</label>
    <input id="task" type="text" placeholder="用中文描述要做的事" disabled />
    <label for="planner-profile">模型</label>
    <select id="planner-profile">
      <option value="edge">边缘</option>
      <option value="cloud">云端</option>
    </select>
    <button id="start" class="primary" type="button" disabled>开始</button>
    <span id="start-reason" class="hint"></span>
    <button id="stop" type="button" disabled>停止</button>
  </div>
  <div id="goal" class="hint">加载后在这里显示当前中文目标。</div>
  <div id="progress" class="hint"></div>
  <div id="status"><span class="phase">就绪</span></div>
  <div id="views">
    <div class="view" id="agent-view"><span class="tag">Agent</span><canvas id="agent"></canvas><span class="placeholder" id="ph-agent">未加载场景</span></div>
    <div class="view" id="wrist-view"><span class="tag">Wrist</span><canvas id="wrist"></canvas><span class="placeholder" id="ph-wrist">未加载场景</span></div>
  </div>
  <div id="confirm" class="ctrl" hidden>
    <button id="ok" type="button">确认成功</button>
    <button id="bad" type="button">确认失败</button>
    <button id="unk" type="button">确认未知</button>
  </div>
  <details id="planner-box">
    <summary>Planner输入/输出</summary>
    <div id="planner-meta" class="hint">还没有请求</div>
    <div id="planner-brief"></div>
    <pre id="planner-full" hidden></pre>
    <button id="planner-expand" type="button">展开完整内容</button>
  </details>
  <details id="exec-box">
    <summary>执行诊断</summary>
    <div id="exec-meta" class="hint">还没有执行</div>
    <div id="exec-brief"></div>
    <pre id="exec-full" hidden></pre>
    <button id="exec-expand" type="button">展开参数和返回</button>
  </details>
  <details id="perf-box">
    <summary>性能、绑定和重置</summary>
    <div id="motion" class="hint"></div>
    <div id="bind-box" class="ctrl">
      <span class="hint" id="bind-note">还没有绑定。</span>
      <select id="bind-choice"></select>
      <button id="bind-apply" type="button">确认目标</button>
    </div>
    <div class="ctrl">
      <label for="execution-mode">模式</label>
      <select id="execution-mode">
        <option value="free" selected>自由</option>
        <option value="benchmark">基准</option>
      </select>
      <button id="restart" type="button" disabled>重置当前场景</button>
    </div>
    <pre id="log"></pre>
  </details>
</div>
<script src="static/app.js?v=view9"></script>
</body>
</html>
