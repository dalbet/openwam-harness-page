<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Page</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --ink:#e6e8eb; --dim:#8b93a1; --accent:#4f8cff; --good:#3ec47e; --bad:#e0563a; --warn:#e0b53a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,Segoe UI,Roboto,"Microsoft YaHei",sans-serif; }
  #app {
    display:flex; flex-direction:column; width:100%; height:100vh; height:100dvh;
    min-height:0; overflow:hidden; padding:10px; gap:8px;
  }
  header, .ctrl { display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  label { color:var(--dim); font-size:12px; }
  select, input[type=text], button {
    background:var(--panel); color:var(--ink); border:1px solid #2a2f3a; border-radius:6px;
    padding:6px 9px; font-size:13px; outline:none; max-width:100%;
  }
  button { cursor:pointer; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { border-color:var(--accent); color:#cfe0ff; }
  #task { flex:1 1 180px; min-width:0; width:12rem; }
  #start-reason { flex:1 1 8rem; min-width:0; }
  #goal, #progress, #status { min-width:0; overflow-wrap:anywhere; }
  #views { flex:1 1 auto; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .view {
    position:relative; background:#000; border:1px solid #2a2f3a; border-radius:8px; overflow:hidden;
    width:100%; height:100%; min-width:0; min-height:0;
  }
  .view canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  .view .tag { position:absolute; left:8px; top:6px; background:rgba(0,0,0,.45); font-size:11px; padding:2px 7px; border-radius:4px; }
  .view .placeholder { color:var(--dim); font-size:12px; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #status { font-size:13px; min-height:20px; color:var(--dim); }
  #status .phase { color:var(--ink); }
  #status .good { color:var(--good); } #status .bad { color:var(--bad); } #status .warn { color:var(--warn); }
  details { flex:0 1 auto; min-height:0; max-height:30vh; overflow:auto; background:var(--panel); border:1px solid #2a2f3a; border-radius:8px; padding:8px 10px; }
  details pre { white-space:pre-wrap; word-break:break-word; max-height:none; overflow:auto; font-size:12px; margin:8px 0 0; }
  #task-steps-box h2 { font-size:14px; margin:8px 0 0; }
  #task-steps { margin:8px 0 0; padding-left:1.2em; }
  #task-steps li[data-status="running"] { color:var(--warn); }
  #task-steps li[data-status="success"] { color:var(--good); }
  #task-steps li[data-status="failed"] { color:var(--bad); }
  #examples button { margin:0 4px 4px 0; }
  .hint { color:var(--dim); font-size:12px; }
  @media (max-width:680px){ #views{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Page</h1>
    <button id="retry" type="button" hidden>重试检查</button>
  </header>
  <div class="ctrl">
    <label for="suite">套件</label>
    <select id="suite" disabled></select>
    <button id="load" class="primary" type="button" disabled>加载场景</button>
    <label for="task">任务</label>
    <input id="task" type="text" placeholder="用中文描述要做的事" disabled />
    <span id="examples" class="hint"></span>
    <label for="planner-profile">模型</label>
    <select id="planner-profile">
      <option value="edge">边缘</option>
      <option value="cloud">云端</option>
    </select>
    <button id="start" class="primary" type="button" disabled>开始</button>
    <span id="start-reason" class="hint"></span>
    <button id="stop" type="button" disabled>停止</button>
    <button id="reset" type="button" disabled>重置场景</button>
  </div>
  <div id="goal" class="hint">加载后在这里显示当前中文目标。</div>
  <div id="progress" class="hint"></div>
  <div id="status"><span class="phase">就绪</span></div>
  <div id="views">
    <div class="view" id="agent-view"><span class="tag">Agent</span><canvas id="agent"></canvas><span class="placeholder" id="ph-agent">未加载场景</span></div>
    <div class="view" id="wrist-view"><span class="tag">Wrist</span><canvas id="wrist"></canvas><span class="placeholder" id="ph-wrist">未加载场景</span></div>
  </div>
  <details id="planner-box">
    <summary>Planner输入/输出</summary>
    <pre id="planner-text">还没有请求</pre>
  </details>
  <section id="task-steps-box">
    <h2>任务与执行步骤</h2>
    <div id="task-summary" class="hint">还没有规划结果</div>
    <ol id="task-steps"></ol>
  </section>
  <details id="diag-box">
    <summary>诊断详情</summary>
    <pre id="diag-text">还没有诊断</pre>
  </details>
</div>
<script src="static/app.js?v=view14"></script>
</body>
</html>
